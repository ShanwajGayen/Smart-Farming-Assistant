<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Crop Assistant</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f7f6;
      color: #333;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto 20px auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h2 {
      color: #1b5e20;
      margin-top: 0;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p.subtitle {
      color: #555;
      font-size: 14px;
      margin: 4px 0 16px 0;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .btn-camera {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #2e7d32;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(46,125,50,0.25);
    }
    .btn-gallery {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: #2e7d32;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 20px;
      border: 2px solid #2e7d32;
      border-radius: 12px;
      cursor: pointer;
    }
    .preview-container {
      margin-top: 16px;
      text-align: center;
    }
    #previewImg {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 12px;
      border: 1px solid #ddd;
      margin-top: 10px;
    }
    #resultBox {
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📸 Leaf / Crop Image Capture</h2>
    <p class="subtitle">Tap to Open Camera or Choose Photo:</p>

    <!-- Hidden Native Inputs for 100% Mobile Stability -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="galleryInput" accept="image/*" style="display: none;">

    <div class="btn-group">
      <button type="button" class="btn-camera" onclick="document.getElementById('cameraInput').click()">
        📷 Open Camera
      </button>
      <button type="button" class="btn-gallery" onclick="document.getElementById('galleryInput').click()">
        🖼️ Choose from Gallery
      </button>
    </div>

    <div class="preview-container">
      <span id="previewLabel" style="font-size: 13px; font-weight: bold; color: #444; display: none;">Image Preview:</span>
      <!-- Clean image tag without broken placeholder text -->
      <img id="previewImg">
    </div>

    <div id="resultBox"></div>
  </div>

  <script src="/js/inference.js"></script>
</body>
</html>
